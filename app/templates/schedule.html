{% extends "base.html" %}
{% block title %}创建排期{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">Schedule</p>
    <h1>提前确认发布时间</h1>
  </div>
</section>

<form class="panel form-stack narrow" method="post" action="/schedule/{{ draft.id }}">
  <p class="muted">{{ draft.selected_title }}</p>
  <label>
    发布时间
    <input type="datetime-local" name="scheduled_at" value="{{ default_at }}" required>
  </label>
  <label>
    时区
    <input name="timezone" value="{{ settings.timezone }}" required>
  </label>
  <button class="button primary" type="submit">创建排期</button>
</form>
{% endblock %}
